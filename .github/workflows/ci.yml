name: StudentApp CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install dependencies and tools
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff bandit

      # Step 4: Build application package
      - name: Build Application
        run: |
          python -m zipfile -c StudentApp.zip \
            app.py test_app.py requirements.txt

      # Step 5: Execute unit tests
      - name: Run Unit Tests
        run: python -m pytest -v

      # Step 6: Check code quality
      - name: Run Ruff
        run: python -m ruff check .

      # Step 7: Perform security analysis
      - name: Run Bandit
        run: python -m bandit -r app.py

      # Step 8: Upload build artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentApp-Build
          path: StudentApp.zip